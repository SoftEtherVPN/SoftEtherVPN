org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# vcpkg provides OpenSSL, zlib and sodium for the Android ABI.
# Set vcpkg.root (or export VCPKG_ROOT) before building. The triplet must match the
# target ABI: arm64-android for arm64-v8a devices, x64-android for x86_64 emulators.
# vcpkg.root=C:\dev\vcpkg
# vcpkg.triplet=arm64-android
