name: Fedora/Rawhide

on:
  schedule:
    - cron: "0 0 25 * *"
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
    - uses: actions/checkout@v1
      with:
        submodules: true
    - name: Install dependencies
      run: |
        dnf -y install git cmake ncurses-devel openssl-devel libsodium-devel readline-devel zlib-devel gcc-c++ clang google-cpu_features-devel rpm-build systemd
    - name: Compile with ${{ matrix.cc }}
      run: |
        export CC=${{ matrix.cc }}
        CMAKE_INSTALL_PREFIX=/usr CMAKE_FLAGS="-DUSE_SYSTEM_CPU_FEATURES=1" CFLAGS="-I/usr/include/cpu_features" ./configure
        make -C build
    - name: Build and install RPM packages
      run: |
        cd build
        cpack -G RPM
        dnf -y install ./softether-*.rpm
        rpm -V softether-common softether-vpnbridge softether-vpnclient softether-vpncmd softether-vpnserver
        test -f /usr/lib/systemd/system/softether-vpnserver.service
