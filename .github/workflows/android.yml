name: android

on: [push, pull_request]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 30.0.16248370

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android
          - abi: armeabi-v7a
            triplet: arm-neon-android
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" >/dev/null

    - name: Check vcpkg availability
      run: test -d "$VCPKG_INSTALLATION_ROOT" && test -x "$VCPKG_INSTALLATION_ROOT/vcpkg"

    - name: Restore vcpkg buildtrees (ports are built against bionic per triplet)
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/share/vcpkg/buildtrees
          /usr/local/share/vcpkg/downloads
        key: vcpkg-android-manifest-v1-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

    - name: Generate hamcore.se2 asset (never committed, always generated)
      run: |
        sudo apt-get -qq update
        # autotools set: libsodium's autoreconf-based port (vcpkg-make); libtoolize lives in libtool-bin on Ubuntu
        sudo apt-get -y install libssl-dev libsodium-dev libncurses-dev libreadline-dev zlib1g-dev pkg-config autoconf autoconf-archive automake libtool libtool-bin
        cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOQS_ENABLE=OFF
        cmake --build build-host --target hamcorebuilder
        mkdir -p SoftEtherVPN-Android/app/src/main/assets
        # assets sits FIVE levels below the repo root: SoftEtherVPN-Android/app/src/main/assets
        test -x build-host/src/hamcorebuilder/hamcorebuilder
        (cd SoftEtherVPN-Android/app/src/main/assets && \
         ../../../../../build-host/src/hamcorebuilder/hamcorebuilder hamcore.se2 ../../../../../src/bin/hamcore)

    - name: Assemble release APK (${{ matrix.abi }})
      working-directory: SoftEtherVPN-Android
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --console=plain \
          -Pvcpkg.root="$VCPKG_INSTALLATION_ROOT" \
          -Pvcpkg.triplet=${{ matrix.triplet }}

    - name: Upload APK (${{ matrix.abi }})
      uses: actions/upload-artifact@v4
      with:
        name: softether-android-release-${{ matrix.abi }}
        path: SoftEtherVPN-Android/app/build/outputs/apk/release/app-release.apk
